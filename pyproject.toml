[project]
name = "benchmate"
version = "0.1.0"
description = "Hindi/English voice partner for mobile phone board repair"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "sqlmodel",
    "uvicorn[standard]",
    "httpx",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest",
    "playwright",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["engine/tests", "mcp_evidence/tests", "scripts/tests", "eval/latency_script", "eval/scenarios", "eval/display_set"]
addopts = "-q"
pythonpath = ["."]
